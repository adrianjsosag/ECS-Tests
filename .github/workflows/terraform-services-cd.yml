# =============================================================================
# CD de los servicios ECS (Terraform/ECS-services-module/services/<servicio>/)
# =============================================================================
#
# Qué hace (3 jobs encadenados):
#   1. detect -> detecta los servicios NUEVOS o MODIFICADOS (script .github/scripts/detect-changed-services.sh)
#                y comprueba que no pisen el state ni la regla del ALB de otro servicio.
#   2. plan   -> terraform plan de cada servicio detectado (en paralelo) y guarda el plan como artifact.
#   3. apply  -> SOLO en main y tras la APROBACIÓN manual del environment "dev":
#                terraform apply del plan guardado (exactamente lo que se revisó).
#
# Cuándo se ejecuta (solo si cambia algo en services/, este workflow o el script):
#   - pull_request hacia main        -> detect + plan (nunca apply)
#   - push a main (p. ej. un merge)  -> detect + plan + apply (con aprobación)
#   - workflow_dispatch (manual)     -> los servicios indicados ("all" o "svc1,svc2"); apply si es main
#
# Los servicios BORRADOS del repositorio NO se destruyen: el workflow solo avisa.
# Las imágenes no se construyen aquí: deben existir en ECR (p. ej. las sube countdown-new-year-ci.yml).
#
# Roles IAM (OIDC, sin llaves de AWS en GitHub), creados por Terraform/GitHub-OIDC-module (github-services-cd.tf):
#   CloudEngineering-dev-gha-services-cd-plan   (job plan)
#     - Secreto AWS_SERVICES_PLAN_ROLE_ARN  = terraform output -json services_cd_role_arns -> "plan"
#     - SOLO LECTURA. Lo pueden asumir los pull requests y la rama main.
#   CloudEngineering-dev-gha-services-cd-apply  (job apply)
#     - Secreto AWS_SERVICES_APPLY_ROLE_ARN = terraform output -json services_cd_role_arns -> "apply"
#     - Crea/cambia/borra SOLO los recursos de un servicio. Solo lo pueden asumir jobs del environment "dev".
#
# Configuración en GitHub (Settings):
#   Secrets and variables -> Actions -> Variables: AWS_REGION = us-east-1
#   Secrets and variables -> Actions -> Secrets:   AWS_SERVICES_PLAN_ROLE_ARN, AWS_SERVICES_APPLY_ROLE_ARN
#   Environments -> "dev" con "Required reviewers" (quién aprueba el apply)
#
# Documentación: .github/workflows/README-terraform-services-cd.md
#
# =============================================================================

name: services CD

on:
  pull_request:
    branches: [main]
    paths:
      - "Terraform/ECS-services-module/services/**"
      - ".github/workflows/terraform-services-cd.yml"
      - ".github/scripts/detect-changed-services.sh"
  push:
    branches: [main]
    paths:
      - "Terraform/ECS-services-module/services/**"
      - ".github/workflows/terraform-services-cd.yml"
      - ".github/scripts/detect-changed-services.sh"
  workflow_dispatch:
    inputs:
      services:
        description: 'Servicios a desplegar: "all" o una lista separada por comas (p. ej. nginx-1,countdown-new-year)'
        required: true
        default: all

# Una sola ejecución a la vez y NUNCA se cancela: cortar un terraform apply deja el state bloqueado
concurrency:
  group: services-cd
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVICES_DIR: Terraform/ECS-services-module/services
  TERRAFORM_VERSION: 1.17.0   # La misma versión con la que se valida la plataforma
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Detect: qué servicios cambiaron (sin AWS)
  # ---------------------------------------------------------------------------
  detect:
    name: Detectar servicios nuevos o modificados
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      has_services: ${{ steps.detect.outputs.has_services }}
      deleted: ${{ steps.detect.outputs.deleted }}
    steps:
      - name: Checkout (historial completo para el diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar servicios y comprobar backend, service_name y prioridades
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          INPUT_SERVICES: ${{ inputs.services }}
        run: |
          case "${EVENT_NAME}" in
            pull_request)
              # Solo los cambios del PR (desde donde se separó de main)
              BASE="$(git merge-base "${PR_BASE}" "${PR_HEAD}")"
              export BASE HEAD="${PR_HEAD}" ;;
            push)
              export BASE="${PUSH_BEFORE}" HEAD="${GITHUB_SHA}" ;;
            workflow_dispatch)
              export SERVICES="${INPUT_SERVICES}" ;;
          esac
          bash .github/scripts/detect-changed-services.sh

  # ---------------------------------------------------------------------------
  # 2. Plan: terraform plan de cada servicio detectado (rol de SOLO LECTURA)
  # ---------------------------------------------------------------------------
  plan:
    name: Plan (${{ matrix.service }})
    needs: detect
    if: needs.detect.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC: credenciales temporales del rol de plan
    strategy:
      fail-fast: false   # el plan de un servicio no corta el de los demás
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    env:
      MANIFESTS: Terraform/ECS-services-module/services/${{ matrix.service }}/manifests
    defaults:
      run:
        working-directory: Terraform/ECS-services-module/services/${{ matrix.service }}/manifests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar la variable y el secreto de GitHub
        working-directory: .
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROLE_ARN: ${{ secrets.AWS_SERVICES_PLAN_ROLE_ARN }}
        run: |
          missing=0
          [[ -n "${AWS_REGION}" ]] || { echo "::error::Falta la variable AWS_REGION"; missing=1; }
          [[ -n "${ROLE_ARN}" ]]   || { echo "::error::Falta el secreto AWS_SERVICES_PLAN_ROLE_ARN (output services_cd_role_arns de Terraform/GitHub-OIDC-module)"; missing=1; }
          exit "${missing}"

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Rol CloudEngineering-dev-gha-services-cd-plan (GitHub-OIDC-module, github-services-cd.tf):
      # solo lectura de los states y de los recursos; escribe solo los *.tflock de los servicios.
      - name: Credenciales de AWS (OIDC, rol CloudEngineering-dev-gha-services-cd-plan)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_SERVICES_PLAN_ROLE_ARN }}
          role-session-name: services-cd-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform fmt -check
        run: terraform fmt -check -diff

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: |
          set -o pipefail
          terraform plan -out=tfplan -no-color | tee plan.txt

      - name: Resumen del plan
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          {
            echo "### Plan de \`${SERVICE}\`"
            echo ""
            echo "**$(grep -E '^(Plan:|No changes)' plan.txt | head -1)**"
            echo ""
            echo '```text'
            grep -E '^  # ' plan.txt || echo "(sin cambios en recursos)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # El apply aplica ESTE plan (no vuelve a calcularlo): lo que se aprueba es lo que se revisó
      - name: Guardar el plan para el job apply
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.service }}
          path: |
            ${{ env.MANIFESTS }}/tfplan
            ${{ env.MANIFESTS }}/.terraform.lock.hcl
          include-hidden-files: true
          retention-days: 5

  # ---------------------------------------------------------------------------
  # 3. Apply: SOLO en main y tras la aprobación del environment "dev"
  # ---------------------------------------------------------------------------
  apply:
    name: Apply (${{ matrix.service }})
    needs: [detect, plan]
    if: >-
      needs.detect.outputs.has_services == 'true' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Aprobación manual: GitHub pausa el job hasta que un "required reviewer" del environment lo apruebe.
    # El token OIDC de este job lleva sub = repo:<repo>:environment:dev (lo exige el rol de apply).
    environment: dev
    permissions:
      contents: read
      id-token: write   # OIDC: credenciales temporales del rol de apply
    strategy:
      fail-fast: false
      max-parallel: 1   # de uno en uno: todos los servicios añaden reglas al mismo listener del ALB
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    env:
      MANIFESTS: Terraform/ECS-services-module/services/${{ matrix.service }}/manifests
    defaults:
      run:
        working-directory: Terraform/ECS-services-module/services/${{ matrix.service }}/manifests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar la variable y el secreto de GitHub
        working-directory: .
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROLE_ARN: ${{ secrets.AWS_SERVICES_APPLY_ROLE_ARN }}
        run: |
          missing=0
          [[ -n "${AWS_REGION}" ]] || { echo "::error::Falta la variable AWS_REGION"; missing=1; }
          [[ -n "${ROLE_ARN}" ]]   || { echo "::error::Falta el secreto AWS_SERVICES_APPLY_ROLE_ARN (output services_cd_role_arns de Terraform/GitHub-OIDC-module)"; missing=1; }
          exit "${missing}"

      - name: Descargar el plan revisado
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.service }}
          path: ${{ env.MANIFESTS }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Rol CloudEngineering-dev-gha-services-cd-apply (GitHub-OIDC-module, github-services-cd.tf):
      # crea/cambia/borra SOLO los recursos de un servicio y escribe solo los states de los servicios.
      - name: Credenciales de AWS (OIDC, rol CloudEngineering-dev-gha-services-cd-apply)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_SERVICES_APPLY_ROLE_ARN }}
          role-session-name: services-cd-apply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: terraform init

      # Si el state cambió desde el plan, Terraform falla con "Saved plan is stale" y no aplica nada
      - name: terraform apply (plan guardado)
        run: terraform apply -no-color tfplan

      - name: Resumen del despliegue
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          {
            echo "### \`${SERVICE}\` desplegado"
            echo ""
            echo "| Output | Valor |"
            echo "|---|---|"
            for o in service_url image task_definition_arn log_group_name; do
              echo "| \`${o}\` | \`$(terraform output -raw "${o}" 2>/dev/null || echo '-')\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
