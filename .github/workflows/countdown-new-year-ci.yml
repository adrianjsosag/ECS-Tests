# =============================================================================
# CI de la app apps/countdown-new-year
# =============================================================================
#
# Qué hace (3 jobs encadenados):
#   1. build -> revisa la sintaxis de Node.js, calcula el tag y construye la imagen Docker.
#   2. test  -> arranca la imagen y ejecuta apps/countdown-new-year/ci/smoke-test.sh
#               (/health, /, /api/config, estáticos, 404 y el HEALTHCHECK de Docker).
#   3. push  -> SOLO si "test" pasa y SOLO en la rama main: sube la imagen a Amazon ECR.
#
# Cuándo se ejecuta (solo si cambian apps/countdown-new-year/** o este archivo):
#   - pull_request hacia main         -> build + test (nunca push)
#   - push a main (p. ej. un merge)   -> build + test + push
#   - workflow_dispatch (manual)      -> build + test + push (si se lanza sobre main)
#
# Tag de la imagen: <version de package.json>-<sha corto del commit>, p. ej. 1.0.0-e60567f.
# El repositorio ECR es IMMUTABLE: un tag no se puede reutilizar, por eso cada commit lleva el suyo.
#
# Rol IAM que usa el job "push" (OIDC, sin llaves de AWS guardadas en GitHub):
#   CloudEngineering-dev-gha-countdown-new-year
#   - Lo crea Terraform/GitHub-OIDC-module (entrada "countdown-new-year" de github_ci_roles).
#   - Su ARN se guarda en el secreto AWS_ROLE_ARN:
#       terraform -chdir=Terraform/GitHub-OIDC-module/manifests output -json role_arns   ->  "countdown-new-year"
#   - Solo permite hacer push a cloudengineering-dev/countdown-new-year y solo desde la rama main.
#
# Configuración en GitHub (Settings -> Secrets and variables -> Actions):
#   Variables: AWS_REGION      = us-east-1
#              ECR_REPOSITORY  = cloudengineering-dev/countdown-new-year
#   Secreto:   AWS_ROLE_ARN    = ARN del rol CloudEngineering-dev-gha-countdown-new-year
#
# Documentación:
#   - Cómo funciona, con diagramas: .github/workflows/README-countdown-new-year-ci.md
#   - Configuración y puesta en marcha: apps/countdown-new-year/README.md
# =============================================================================

name: countdown-new-year CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/countdown-new-year/**"
      - ".github/workflows/countdown-new-year-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/countdown-new-year/**"
      - ".github/workflows/countdown-new-year-ci.yml"
  workflow_dispatch:

# Una sola ejecución a la vez por rama. En los PR se cancela la anterior al subir un commit nuevo;
# en main no, para no cortar un push a ECR a medias.
concurrency:
  group: countdown-new-year-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Permisos mínimos por defecto; el job "push" añade id-token: write para OIDC.
permissions:
  contents: read

env:
  APP_DIR: apps/countdown-new-year   # Carpeta de la app (contexto del docker build)
  IMAGE_NAME: countdown-new-year     # Nombre local de la imagen entre jobs

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build: sintaxis de Node.js + imagen Docker (se pasa a los otros jobs como artifact)
  # ---------------------------------------------------------------------------
  build:
    name: Build (Node.js + imagen Docker)
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node.js 22 (la misma versión que la imagen node:22-alpine)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # La app no tiene dependencias (no hay npm install): basta con comprobar la sintaxis
      - name: Comprobar la sintaxis de JavaScript
        working-directory: ${{ env.APP_DIR }}
        run: |
          node --check server.js
          node --check public/app.js

      - name: Calcular el tag de la imagen (<versión>-<sha corto>)
        id: meta
        working-directory: ${{ env.APP_DIR }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          IMAGE_TAG="${VERSION}-${GITHUB_SHA::7}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Tag de la imagen: ${IMAGE_TAG}"

      # linux/amd64: Fargate ejecuta las tareas en X86_64
      - name: Construir la imagen Docker
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.version="${IMAGE_TAG}" \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${APP_DIR}"

      - name: Guardar la imagen para los jobs test y push
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: docker save "${IMAGE_NAME}:${IMAGE_TAG}" | gzip > image.tar.gz

      - name: Subir la imagen como artifact
        uses: actions/upload-artifact@v4
        with:
          name: countdown-new-year-image
          path: image.tar.gz
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 2. Test: arranca la imagen construida y comprueba que la app responde
  # ---------------------------------------------------------------------------
  test:
    name: Test (smoke test del contenedor)
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE: countdown-new-year:${{ needs.build.outputs.image_tag }}
    steps:
      - name: Checkout (para el script de smoke test)
        uses: actions/checkout@v4

      - name: Descargar la imagen
        uses: actions/download-artifact@v4
        with:
          name: countdown-new-year-image

      - name: Cargar la imagen en Docker
        run: gunzip -c image.tar.gz | docker load

      - name: Arrancar el contenedor
        run: docker run -d --name countdown-test -p 3000:3000 -e TIMEZONE=UTC "${IMAGE}"

      - name: Smoke test
        run: bash "${APP_DIR}/ci/smoke-test.sh" http://localhost:3000 countdown-test

      - name: Logs del contenedor (solo si algo falló)
        if: failure()
        run: docker logs countdown-test

      - name: Parar el contenedor
        if: always()
        run: docker rm -f countdown-test || true

  # ---------------------------------------------------------------------------
  # 3. Push a ECR: solo si "test" pasó y solo en main (nunca en pull requests)
  # ---------------------------------------------------------------------------
  push:
    name: Push a Amazon ECR
    needs: [build, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC: GitHub emite un token que AWS cambia por credenciales temporales del rol
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      AWS_REGION: ${{ vars.AWS_REGION }}           # Variable de GitHub: us-east-1
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}   # Variable de GitHub: cloudengineering-dev/countdown-new-year
    steps:
      - name: Comprobar las variables y el secreto de GitHub
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          missing=0
          [[ -n "${AWS_REGION}" ]]     || { echo "::error::Falta la variable AWS_REGION (Settings > Secrets and variables > Actions > Variables)"; missing=1; }
          [[ -n "${ECR_REPOSITORY}" ]] || { echo "::error::Falta la variable ECR_REPOSITORY"; missing=1; }
          [[ -n "${AWS_ROLE_ARN}" ]]   || { echo "::error::Falta el secreto AWS_ROLE_ARN (output role_arns de Terraform/GitHub-OIDC-module)"; missing=1; }
          exit "${missing}"

      - name: Descargar la imagen
        uses: actions/download-artifact@v4
        with:
          name: countdown-new-year-image

      - name: Cargar la imagen en Docker
        run: gunzip -c image.tar.gz | docker load

      # Asume el rol CloudEngineering-dev-gha-countdown-new-year (Terraform/GitHub-OIDC-module,
      # entrada "countdown-new-year" de github_ci_roles). Su política solo permite:
      #   - ecr:GetAuthorizationToken (login)
      #   - push/lectura en cloudengineering-dev/countdown-new-year
      # y su trust policy solo acepta tokens de adrianjsosag/ECS-Tests en la rama main.
      - name: Credenciales de AWS (OIDC, rol CloudEngineering-dev-gha-countdown-new-year)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: countdown-new-year-ci-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login en Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # IMMUTABLE: si el tag ya existe (p. ej. al relanzar el mismo commit) no se vuelve a subir
      - name: Comprobar si el tag ya existe en ECR
        id: exists
        run: |
          if aws ecr describe-images --repository-name "${ECR_REPOSITORY}" \
               --image-ids imageTag="${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "::notice::El tag ${IMAGE_TAG} ya existe en ${ECR_REPOSITORY} (repositorio IMMUTABLE): no se vuelve a subir"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Subir la imagen a ECR
        if: steps.exists.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      # Informativo: el resultado del escaneo no bloquea el workflow
      - name: Escaneo de vulnerabilidades y resumen
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          DIGEST="$(aws ecr describe-images --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" --query 'imageDetails[0].imageDigest' --output text)"
          if aws ecr wait image-scan-complete --repository-name "${ECR_REPOSITORY}" --image-id imageTag="${IMAGE_TAG}"; then
            FINDINGS="$(aws ecr describe-image-scan-findings --repository-name "${ECR_REPOSITORY}" \
              --image-id imageTag="${IMAGE_TAG}" --query 'imageScanFindings.findingSeverityCounts' --output json)"
          else
            FINDINGS="El escaneo no terminó a tiempo: revísalo en la consola de ECR"
          fi
          {
            echo "### Imagen publicada en Amazon ECR"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Imagen | \`${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Vulnerabilidades | \`$(echo "${FINDINGS}" | tr -d '\n ')\` |"
            echo ""
            echo "Para desplegarla en ECS: \`image_tag = \"${IMAGE_TAG}\"\` en el \`service.auto.tfvars\` del servicio."
          } >> "$GITHUB_STEP_SUMMARY"
