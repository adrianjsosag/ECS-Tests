<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuenta regresiva a Año Nuevo</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <canvas id="confetti"></canvas>

  <main class="card">
    <p class="eyebrow">Cuenta regresiva</p>
    <h1>Año Nuevo <span id="next-year" class="gradient-text">----</span></h1>
    <p class="timezone">Zona horaria: <strong id="timezone">—</strong></p>

    <section class="clock" aria-live="polite">
      <div class="unit"><span id="days" class="value">--</span><span class="label">Días</span></div>
      <div class="unit"><span id="hours" class="value">--</span><span class="label">Horas</span></div>
      <div class="unit"><span id="minutes" class="value">--</span><span class="label">Minutos</span></div>
      <div class="unit"><span id="seconds" class="value">--</span><span class="label">Segundos</span></div>
    </section>

    <section class="progress">
      <div class="progress-header">
        <span>Progreso del año <span id="current-year"></span></span>
        <span id="percent" class="percent">0.0000%</span>
      </div>
      <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar">
        <div class="fill" id="fill"><div class="shine"></div></div>
      </div>
      <p class="remaining" id="remaining">Calculando…</p>
    </section>

    <p class="celebration hidden" id="celebration">🎉 ¡Feliz Año Nuevo! 🎉</p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
